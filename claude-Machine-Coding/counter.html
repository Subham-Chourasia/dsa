<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./counter.css">
</head>
<body>
    <div class="container">
        <button class="primary-button" id="increment">Increment</button>
        <button class="primary-button" id="decrement">Decrement</button>
        <button class="primary-button" id="reset">Reset</button>
    </div>
    <div>
        <h3>Count: <span id="count-val"></span> </h3>
    </div>
    <br><br>
    <div class="container">
        <button class="primary-button" id="toggle">Toggle</button>
    </div>
        <div>
        <h3>Value: <span id="bool-val"></span> </h3>
    </div>
    <br><br>
    <div class="container">
        <button class="primary-button" id="start-Stopwatch">Start Stopwatch: </button>
    </div>
        <div>
        <h3>Stopwatch Value: <span id="bool-stopwatch"></span></h3>
    </div>

    <div class="container">
        <button class="primary-button" id="stop-Stopwatch">Stop Stopwatch: </button>
    </div>
    <br><br><br>
    <div class="container">
        <div style="padding: 30px;">
             <input type="text" name="inpVal" id="inpVal">
        </div>
        <div style="padding: 30px;">
            <h3>Input is: <span id="inp-val-out"></span></h3>
        </div>
    </div>
    <script src="./counter.js"></script>
</body>
</html>
